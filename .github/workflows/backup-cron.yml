# PawPilot scheduled jobs — PRIMARY driver for the agent pipeline.
# (Vercel cron entries in vercel.json are the BACKUP.)
#
# Why the pipeline runs here instead of on Vercel: the Vercel Hobby plan
# kills serverless functions after 60s, but the daily agent run (trend
# research + up to 3 full post generations with images) takes 10-20 minutes.
# GitHub Actions runners allow up to 6 hours, so the heavy jobs execute the
# same code directly via scripts/agent-run.ts.
#
# Scheduling (staggered so the runners never fight over the DB job lock):
#   01:00 UTC daily   -> agent job below (PRIMARY)
#   01:35 UTC daily   -> Vercel cron /api/cron/agent (BACKUP, 409-skips when
#                        the primary already claimed the lock)
#   every 10 min      -> publish check (curls the lightweight endpoint)
#   every 30 min      -> slot guardian below: fills any publish slot in the
#                        next 90 min that has no post yet, so content is ready
#                        ~1 hour before publish time even if the daily run failed
#   02:00 UTC Sunday  -> refresh job below (PRIMARY; Vercel cron is backup)
#
# A timed-out or crashed run never blocks the next one: the job lock has a
# 30-minute TTL refreshed by a heartbeat while the job is alive
# (see withJobLock/startLockHeartbeat in lib/agent/pipeline.ts).
#
# Required repository secrets (repo Settings -> Secrets and variables -> Actions):
#   DATABASE_URL                 production Postgres connection string
#   SITE_URL                     e.g. https://pawpilot-zlpp.vercel.app (IndexNow pings)
#   CRON_SECRET                  shared secret for the publish-curl job
# Effectively required in production (generated images would be lost otherwise):
#   BLOB_READ_WRITE_TOKEN    (Vercel Blob store connected to the project)
# Optional (same meaning as in the app; pipeline works with zero keys):
#   GEMINI_API_KEY, OPENROUTER_API_KEY, PEXELS_API_KEY
name: PawPilot scheduled jobs
on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "*/10 * * * *"
    - cron: "*/30 * * * *"
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [agent, publish, guardian, refresh, all]
        default: all
        required: true
jobs:
  agent:
    name: Daily agent (primary, runs in Actions)
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'agent' || inputs.job == 'all'))
      || (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run daily agent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npx tsx scripts/agent-run.ts --job=agent
  guardian:
    name: Slot guardian (1h-before safety net)
    if: github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run slot guardian
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npx tsx scripts/agent-run.ts --job=guardian
  publish:
    name: Publisher (curls lightweight endpoint)
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'publish' || inputs.job == 'all'))
      || (github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger publish cron
        run: |
          set -u
          code=$(curl -sS -o /tmp/pawpilot-cron.json -w '%{http_code}' --max-time 55 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron/publish")
          echo "HTTP $code"
          if [ "$code" = "409" ]; then exit 0; fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then exit 1; fi
  refresh:
    name: Weekly refresh (primary, runs in Actions)
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'refresh' || inputs.job == 'all'))
      || (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run weekly refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx tsx scripts/agent-run.ts --job=refresh
